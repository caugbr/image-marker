<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Maker - Gerador com CSS separado</title>
    <link rel="stylesheet" href="assets/im.css">
<base target="_blank">
</head>
<body>
    <header>
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
            </svg>
            Image Maker
        </h1>
        <div class="toolbar">
            <div class="tool-group">
                <input type="text" id="folderPath" placeholder="Caminho da pasta (ex: assets/prints/)" 
                    style="background: #0f172a; border: 1px solid #475569; color: white; padding: 4px 8px; border-radius: 4px; width: 284px; font-size: 16px;">
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button class="btn" onclick="document.getElementById('imageInput').click()">
                📁 Carregar Imagem
            </button>
            <div class="tool-group">
                <button class="tool-btn active" data-tool="pointer" title="Mover/Selecionar">🖱️</button>
                <button class="tool-btn" data-tool="point" title="Marcar Ponto">📍</button>
                <button class="tool-btn" data-tool="area" title="Marcar Área">⬜</button>
            </div>
            <button class="btn secondary" onclick="clearAll()" id="btnClear" disabled>🗑️ Limpar</button>
            <button class="btn success" onclick="generateCode()" id="btnExport" disabled>📋 Gerar Código</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Marcações <span class="badge badge-blue" id="countBadge">0</span></h2>
            </div>
            <div class="markup-list" id="markupList">
                <div class="empty-state">
                    <p>Carregue uma imagem e comece a marcar</p>
                </div>
            </div>
        </aside>

        <div class="canvas-area" id="canvasArea">
            <div class="empty-state" id="emptyCanvas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 16l6-6 4 4 8-8"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                </svg>
                <p style="font-size: 1.125rem; margin-bottom: 8px;">Nenhuma imagem carregada</p>
                <p style="font-size: 0.875rem;">Clique em "Carregar Imagem" para começar</p>
            </div>
            <div class="canvas-wrapper" id="canvasWrapper" style="display:none">
                <img id="canvasImage" src="" alt="Screenshot">
                <div id="annotationsLayer"></div>
                <div class="selection-rect" id="selectionRect" style="display:none"></div>
            </div>
            <div class="zoom-controls" id="zoomControls" style="display:none">
                <button onclick="zoom(-0.1)">−</button>
                <span id="zoomLevel">100%</span>
                <button onclick="zoom(0.1)">+</button>
                <button onclick="resetZoom()">⌂</button>
            </div>
        </div>
    </div>

    <!-- Modal de exportação -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 Código Gerado</h3>
                <button class="btn secondary" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="export-tabs">
                    <button class="export-tab active" onclick="switchExportTab('html')">📄 HTML (com classes)</button>
                    <button class="export-tab" onclick="switchExportTab('css')">🎨 CSS (separado)</button>
                    <button class="export-tab" onclick="switchExportTab('combined')">📦 HTML + CSS (inline)</button>
                </div>
                <div id="codeOutputContainer">
                    <div class="code-block" id="codeOutput"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="copyCode()">📋 Copiar</button>
                <button class="btn secondary" onclick="downloadCurrent()">💾 Baixar</button>
                <button class="btn secondary" onclick="closeModal()">Fechar</button>
            </div>
        </div>
    </div>

    <script src="assets/im.js"></script>
</body>
</html>
